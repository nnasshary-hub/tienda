<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:fragment="head">
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title th:text="#{aplicacion.titulo}">TechShop</title>

        <link rel="stylesheet"
              th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/>
        <link rel="stylesheet"
              th:href="@{/webjars/font-awesome/7.2.0/css/all.min.css}"/>

        <script defer
        th:src="@{/webjars/jquery/4.0.0/jquery.min.js}"></script>
        <script defer
        th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
    </head>

    <body>
        <header th:fragment="header">
            <nav class="navbar navbar-expand navbar-dark bg-dark">
                <div class="container flex-wrap">
                    <a class="navbar-brand"
                       th:href="@{/}"
                       th:text="#{aplicacion.titulo}">
                        TechShop
                    </a>

                    <div class="navbar-nav flex-wrap">
                        <a class="nav-link" th:href="@{/}">Inicio</a>
                        <a class="nav-link"
                           th:href="@{/categoria/listado}">Categorías</a>
                        <a class="nav-link"
                           th:href="@{/producto/listado}">Productos</a>
                        <a class="nav-link"
                           th:href="@{/consultas/listado}">Consultas</a>
                    </div>
                </div>
            </nav>
        </header>

        <footer th:fragment="footer"
                class="container text-center text-muted py-4">
            <span th:text="#{aplicacion.titulo}">TechShop</span>
        </footer>

        <section th:fragment="confirmarEliminar(urlEliminar, nombreId)">
            <div class="modal fade"
                 id="confirmModal"
                 tabindex="-1"
                 aria-labelledby="confirmModalTitulo"
                 aria-hidden="true">

                <div class="modal-dialog">
                    <div class="modal-content">
                        <form method="post" th:action="${urlEliminar}">
                            <div class="modal-header">
                                <h5 class="modal-title"
                                    id="confirmModalTitulo"
                                    th:text="#{accion.confirmar}">
                                    Confirmar eliminación
                                </h5>

                                <button type="button"
                                        class="btn-close"
                                        data-bs-dismiss="modal"
                                        aria-label="Cerrar"></button>
                            </div>

                            <div class="modal-body">
                                <input type="hidden"
                                       id="modalId"
                                       th:name="${nombreId}"/>

                                <p>
                                    <span th:text="#{accion.confirmar.texto1}"></span>
                                    <strong id="modalDescripcion"></strong>?
                                </p>

                                <p th:text="#{accion.confirmar.texto2}"></p>
                            </div>

                            <div class="modal-footer">
                                <button type="button"
                                        class="btn btn-secondary"
                                        data-bs-dismiss="modal"
                                        th:text="#{accion.cerrar}">
                                    Cerrar
                                </button>

                                <button type="submit"
                                        class="btn btn-danger"
                                        th:text="#{accion.eliminar}">
                                    Eliminar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <script defer th:src="@{/js/rutinas.js}"></script>
        </section>

        <section th:fragment="mostrarToast"
                 class="toast-container position-fixed bottom-0 end-0 p-3">

            <div th:if="${todoOk != null}"
                 class="toast show text-bg-success"
                 role="status">
                <div class="toast-body" th:text="${todoOk}"></div>
            </div>

            <div th:if="${error != null}"
                 class="toast show text-bg-danger"
                 role="alert">
                <div class="toast-body" th:text="${error}"></div>
            </div>

            <script>
                setTimeout(function () {
                    document.querySelectorAll('.toast').forEach(function (toast) {
                        toast.classList.remove('show');
                    });
                }, 4000);
            </script>
        </section>
    </body>
</html>
